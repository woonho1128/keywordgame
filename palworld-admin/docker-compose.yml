# 팰월드 관리 패널 + Cloudflare Tunnel
#
# 이 스택은 "이미 돌고 있는 팰월드 서버"의 도커 네트워크에 합류해서
# 컨테이너 이름(palworld-server)으로 RCON(25575)에 직접 붙습니다.
# → RCON 포트를 외부에 열 필요가 전혀 없습니다(보안).
#
# 사전 확인: 팰월드 서버 컨테이너가 만든 네트워크 이름 확인
#   docker network ls   →  보통 'palworld-server_default'
#   다르면 아래 networks.palworld.name 을 그 이름으로 바꾸세요.

services:
  palworld-admin:
    build: .
    container_name: palworld-admin
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data        # 작업 로그(actions.log) 영구 저장
    networks:
      - palworld
    # 호스트로 포트를 열지 않습니다 — cloudflared 만 내부에서 접근(외부 노출 0)

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: palworld-cloudflared
    restart: unless-stopped
    networks:
      - palworld
    depends_on:
      - palworld-admin
    # === 명명 터널(고정 주소/내 도메인) — .env 의 TUNNEL_TOKEN 사용 ===
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    #
    # === 임시 터널(무료, 계정 불필요, 랜덤 URL)로 쓰려면: ===
    # 위 command/environment 두 줄을 주석 처리하고 아래 한 줄로 교체
    # command: tunnel --no-autoupdate --url http://palworld-admin:3000

networks:
  palworld:
    external: true
    name: palworld-server_default
