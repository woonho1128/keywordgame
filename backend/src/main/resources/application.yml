spring:
  application:
    name: wordplay-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Supabase Transaction Pooler 사용 시 필수:
  #   prepareThreshold=0   (prepared statement 비활성)
  #   channelBinding=disable (JDBC SCRAM-SHA-256 인증 호환)
  #   sslmode=require
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wordplay?prepareThreshold=0}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      data-source-properties:
        prepareThreshold: 0
        preparedStatementCacheQueries: 0

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false
    show-sql: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# CORS 허용 origin (쉼표 구분, 환경변수로 오버라이드 가능)
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  game:
    id-length: 8
    max-word-length: 20
    wordguess-max-attempts: 5
  wordsim:
    # WordSim 참고용 벡터 사전 위치 (rank 비교 기준)
    vectors-path: ${WORDSIM_VECTORS_PATH:/etc/wordplay/word_vectors.bin}
  openai:
    # OpenAI API 키 (WordSim 임베딩 + 사주 해석 공용)
    # 비어있으면 WordSim은 사전 단어만, 사주는 비활성
    api-key: ${OPENAI_API_KEY:}
    # 모델은 word_vectors.bin 빌드한 모델과 동일해야 함!
    # text-embedding-3-small (1536d, $0.02/1M) 또는 text-embedding-3-large (3072d, $0.13/1M)
    model: ${OPENAI_MODEL:text-embedding-3-large}
    timeout-ms: 10000
    # --- 사주 해석용 Chat Completions ---
    # OpenAI 호환 게이트웨이를 쓰면 chat-url만 바꾸면 된다
    chat-url: ${OPENAI_CHAT_URL:https://api.openai.com/v1/chat/completions}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    chat-timeout-ms: 60000
    chat-temperature: 0.85
    chat-max-tokens: 2000
  saju:
    # 공유 URL(/saju/{id})에 쓰는 ID 길이
    id-length: 8
    # 한국 표준시는 동경 135도 기준이라 서울(약 127도)은 실제 태양시보다 30분 빠르다.
    # 시주 경계 판정에만 영향. 0으로 두면 보정하지 않는다.
    longitude-offset-minutes: ${SAJU_LONGITUDE_OFFSET:-30}
    # 같은 사람 + 같은 종류면 이전 해석을 재사용 (사주는 안 바뀌고, AI 호출 비용도 아낀다)
    reuse-same-input: ${SAJU_REUSE:true}
    # AI 호출 한도 (in-memory, 24시간 단위). 실제 비용이 나가므로 최소한의 방어
    limit-per-session: ${SAJU_LIMIT_PER_SESSION:10}
    limit-total: ${SAJU_LIMIT_TOTAL:300}

---
# 로컬 개발 프로필
spring:
  config:
    activate:
      on-profile: local

# 운영 프로필 (Oracle Cloud)
# Next.js와 Spring Boot가 같은 서버에서 돌고, nginx가 프론트로 받아서
# /api/*만 Next.js → Spring Boot로 internal rewrite. 즉 same-origin 통신.
---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
app:
  cookie:
    secure: true        # HTTPS 전제
    same-site: Lax      # same-origin이라 Lax로 충분 (Strict는 OAuth류에서 깨질 수 있음)
logging:
  level:
    root: INFO
    com.wordplay: INFO
    org.hibernate.SQL: WARN
